<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Star Dock</title>
<style>
@font-face{font-family:'Orbitron';font-weight:700;font-display:swap;src:url(fonts/orbitron-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Orbitron';font-weight:900;font-display:swap;src:url(fonts/orbitron-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Share Tech Mono';font-weight:400;font-display:swap;src:url(fonts/share-tech-mono-latin-400-normal.woff2) format('woff2')}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--s:1}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#05010f;color:#f3eaff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Share Tech Mono',ui-monospace,Menlo,monospace}
#app{position:fixed;inset:0;display:flex;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
#wrap{position:relative;box-shadow:0 0 0 1px rgba(255,79,216,.25),0 0 40px rgba(120,60,255,.25)}
canvas{display:block}
#strip{width:72px;flex:none;position:relative;background:linear-gradient(180deg,#160634,#0c0320);border-left:1px solid rgba(110,243,255,.35);touch-action:none;cursor:ns-resize}
@media (pointer:fine){#strip{width:58px}}
#track{position:absolute;left:50%;top:16px;bottom:34px;width:12px;transform:translateX(-50%);border-radius:6px;background:repeating-linear-gradient(180deg,rgba(110,243,255,.28) 0 2px,transparent 2px 12px)}
#knob{position:absolute;left:50%;top:50%;width:38px;height:22px;margin-left:-19px;margin-top:-11px;border-radius:11px;background:linear-gradient(90deg,#ff4fd8,#6ef3ff);box-shadow:0 0 12px rgba(255,79,216,.7)}
#strip.active #knob{box-shadow:0 0 22px #6ef3ff,0 0 6px #fff}
#stripLabel{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;color:#6ef3ff;opacity:.75}
#hudBtns{position:absolute;top:calc(3px*var(--s));right:calc(6px*var(--s));display:flex;gap:5px}
.hb{font:inherit;font-size:clamp(10px,calc(13px*var(--s)),14px);color:#f3eaff;background:rgba(255,79,216,.14);border:1px solid rgba(255,79,216,.55);border-radius:6px;height:clamp(20px,calc(22px*var(--s)),26px);min-width:clamp(26px,calc(32px*var(--s)),36px);padding:0 6px;cursor:pointer;line-height:1}
.hb.on{background:rgba(110,243,255,.25);border-color:#6ef3ff}
.snd{display:flex;align-items:center;gap:4px}
.snd svg{display:none;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd[data-state=all] .i-all,.snd[data-state=fx] .i-fx,.snd[data-state=mute] .i-mute{display:block}
.snd[data-state=all]{border-color:#6ef3ff;box-shadow:0 0 8px rgba(110,243,255,.45)}
.snd[data-state=mute]{opacity:.55}
#lvPick select{font:inherit;color:#fff;background:#1a0b3a;border:1px solid rgba(110,243,255,.5);border-radius:5px;margin-left:4px}
#ver{margin-top:.7em;font-size:.75em;color:rgba(159,238,255,.55);letter-spacing:.1em}
#comm,#demoTag{display:none}
.demo #comm{display:flex}
.demo #demoTag{display:block}
.demo #pad,.demo #testPanel{display:none!important}
#comm{position:absolute;left:calc(8px*var(--s));right:calc(110px*var(--s));bottom:calc(6px*var(--s));min-height:calc(30px*var(--s));align-items:flex-start;gap:8px;padding:5px 10px;background:rgba(4,14,16,.8);border:1px solid rgba(125,255,154,.45);border-radius:6px;font-size:clamp(11px,calc(14px*var(--s)),15px);color:#b9ffcf;line-height:1.3;pointer-events:none;text-shadow:0 0 6px rgba(125,255,154,.45)}
#comm .who{color:#7dff9a;white-space:nowrap}
#comm .cur{animation:cblink 1s steps(2) infinite}
@keyframes cblink{50%{opacity:0}}
#demoTag{position:absolute;top:calc(34px*var(--s));left:50%;transform:translateX(-50%);font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(11px,calc(15px*var(--s)),16px);letter-spacing:.2em;color:#ffd36e;text-shadow:0 0 10px rgba(255,79,216,.7);pointer-events:none;animation:cblink 1.6s steps(2) infinite}
#statsNote{margin-top:.4em;font-size:.85em;color:#9feeff}
#pad{position:absolute;left:calc(10px*var(--s));bottom:calc(10px*var(--s));display:flex;gap:calc(10px*var(--s));touch-action:none}
.pb{width:clamp(54px,calc(70px*var(--s)),76px);height:clamp(54px,calc(70px*var(--s)),76px);border-radius:50%;font:inherit;font-size:clamp(10px,calc(13px*var(--s)),14px);line-height:1.15;cursor:pointer;touch-action:none}
.pb:active{transform:scale(.94)}
.pb b{font-size:1.35em;color:#fff}
#btnMine{color:#ffd9d9;background:radial-gradient(circle at 40% 35%,rgba(255,90,90,.45),rgba(90,10,30,.55));border:2px solid rgba(255,90,90,.75);box-shadow:0 0 14px rgba(255,60,60,.4)}
#btnMine.empty{opacity:.35}
#btnBrake{--f:1;color:#dffaff;border:2px solid rgba(110,243,255,.7);box-shadow:0 0 14px rgba(110,243,255,.35);background:radial-gradient(circle,rgba(8,30,60,.9) 0 61%,transparent 63%),conic-gradient(#6ef3ff calc(var(--f)*360deg),rgba(110,243,255,.12) 0)}
#btnBrake.on{box-shadow:0 0 24px #6ef3ff;transform:scale(.94)}
#btnBrake .ar{font-size:1.2em;color:#fff;letter-spacing:-2px}
#toast{position:absolute;top:calc(36px*var(--s));left:50%;transform:translateX(-50%);background:rgba(18,6,44,.94);border:1px solid #ff4fd8;border-radius:8px;padding:6px 12px;font-size:12px;max-width:80%;text-align:center;pointer-events:none;transition:opacity .4s;opacity:0;z-index:5}
#toast.show{opacity:1}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,1,15,.5)}
.card{max-width:min(94%,600px);max-height:96%;overflow:auto;text-align:center;padding:clamp(10px,calc(20px*var(--s)),24px) clamp(12px,calc(26px*var(--s)),30px);border:1px solid rgba(110,243,255,.4);border-radius:14px;background:rgba(18,6,44,.88);box-shadow:0 0 30px rgba(255,79,216,.25);font-size:clamp(10px,calc(13.5px*var(--s)),16px);touch-action:auto}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(22px,calc(46px*var(--s)),56px);letter-spacing:.08em;line-height:1.05;background:linear-gradient(90deg,#ff4fd8,#ffd36e,#6ef3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,79,216,.5))}
#ovSub{color:#6ef3ff;letter-spacing:.2em;margin:.3em 0 .6em;font-size:.9em}
#ovBody{text-align:left;line-height:1.35;margin:0 auto .7em;max-width:34em}
.btnrow{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
#ovBody ul{list-style:none}
#ovBody li{padding-left:1.2em;position:relative;margin:.15em 0}
#ovBody li::before{content:'▸';position:absolute;left:0;color:#ff4fd8}
#ovBody .c{text-align:center}
.big{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.25em;letter-spacing:.15em;color:#fff;background:linear-gradient(90deg,#ff4fd8,#8a5cff);border:0;border-radius:30px;padding:.55em 1.8em;cursor:pointer;box-shadow:0 0 18px rgba(255,79,216,.6)}
.small{font:inherit;font-size:.85em;color:#cfe;background:transparent;border:1px solid rgba(110,243,255,.45);border-radius:20px;padding:.35em 1em;cursor:pointer}
.small.on{background:rgba(110,243,255,.2);color:#fff}
#testPanel{position:absolute;left:calc(176px*var(--s));right:calc(112px*var(--s));bottom:calc(6px*var(--s));display:flex;flex-wrap:wrap;gap:4px 12px;align-items:flex-end;background:rgba(10,3,30,.7);border:1px solid rgba(110,243,255,.4);border-radius:8px;padding:4px 10px 6px;font-size:11px;touch-action:auto}
#testPanel label.sl{display:flex;flex-direction:column;flex:1 1 110px;min-width:96px;color:#9feeff}
#testPanel label.sl span{display:flex;justify-content:space-between}
#testPanel output{color:#fff}
#testPanel input[type=range]{width:100%;accent-color:#ff4fd8;height:18px}
#testPanel .trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#testPanel button{font:inherit;font-size:11px;color:#f3eaff;background:rgba(255,79,216,.16);border:1px solid rgba(255,79,216,.55);border-radius:6px;padding:3px 7px;cursor:pointer}
#testPanel button.on{background:rgba(110,243,255,.3);border-color:#6ef3ff}
#testPanel .seg{display:flex;gap:3px;align-items:center;color:#9feeff}
#testPanel select{font:inherit;font-size:11px;color:#fff;background:#1a0b3a;border:1px solid rgba(110,243,255,.5);border-radius:5px;padding:1px 3px}
#testPanel .chk{display:flex;gap:4px;align-items:center;color:#9feeff}
#rotate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0320;color:#6ef3ff;font-size:18px;text-align:center;padding:30px}
#rotate .ph{width:46px;height:78px;border:3px solid #ff4fd8;border-radius:9px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="hudBtns">
        <button class="hb" id="btnTest" title="Test mode">TEST</button>
        <button class="hb snd" id="btnSound" title="Sound: tap to change" data-state="all"><svg class="i-all" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><svg class="i-fx" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg><span id="soundLabel">Music &amp; FX</span></button>
        <button class="hb" id="btnFs" title="Full screen (F)">⛶</button>
        <button class="hb" id="btnPause" title="Pause (P)">❚❚</button>
      </div>
      <div id="pad">
        <button class="pb" id="btnMine" title="Drop mine (Space)">MINE<br><b id="mineCount">3</b></button>
        <button class="pb" id="btnBrake" title="Hold to brake (← or Shift)">BRAKE<br><span class="ar">◀◀</span></button>
      </div>
      <div id="toast"></div>
      <div id="demoTag">DEMO · TAP TO PLAY</div>
      <div id="comm"><span class="who">CH7 ▸ DEX:</span><span><span id="commText"></span><span class="cur">▌</span></span></div>
      <div id="testPanel" hidden>
        <label class="sl"><span>Start speed <output id="oSpeed"></output></span><input type="range" id="tSpeed" min="40" max="260" step="5"></label>
        <label class="sl"><span>New stars /s <output id="oRate"></output></span><input type="range" id="tRate" min="0" max="4" step="0.1"></label>
        <label class="sl"><span>Station speed <output id="oStation"></output></span><input type="range" id="tStation" min="0" max="160" step="5"></label>
        <label class="sl"><span>Speed +/level <output id="oStep"></output></span><input type="range" id="tStep" min="0" max="40" step="5"></label>
        <label class="sl"><span>Docks/level <output id="oLvD"></output></span><input type="range" id="tLvD" min="3" max="20" step="1"></label>
        <label class="sl"><span>Minutes/level <output id="oLvM"></output></span><input type="range" id="tLvM" min="1" max="6" step="0.5"></label>
        <label class="sl"><span>Planet gravity <output id="oGrav"></output></span><input type="range" id="tGrav" min="0" max="3" step="0.25"></label>
        <div class="hint" id="gpDbg" style="flex-basis:100%;font-size:10px;color:#a99ad8"></div>
        <div class="trow">
          <span class="seg">Rocket:<button data-st="tilt">Tilt</button><button data-st="roll">Roll</button><button data-st="both">Both</button></span>
          <label class="chk"><input type="checkbox" id="tGod"> Invincible</label>
          <button id="tClear">Clear stars</button>
          <label class="chk">Level <select id="tLevel"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label>
          <button id="tNext">Next level</button>
          <button id="tReset">Defaults</button>
        </div>
      </div>
      <div id="overlay">
        <div class="card">
          <h1 id="ovTitle">STAR DOCK</h1>
          <div id="ovSub"></div>
          <div id="ovBody"></div>
          <div class="btnrow"><button class="big" id="btnPlay">PLAY</button><button class="small" id="btnDemo">▶ Demo</button><button class="small" id="btnFsOv">⛶ Full screen</button><button class="small" id="btnTestToggle">TEST MODE: OFF</button><label class="small" id="lvPick" hidden>Start level <select id="tLevelOv"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label></div>
          <div id="ver"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="strip"><div id="track"><div id="knob"></div></div><div id="stripLabel">SLIDE</div></div>
</div>
<div id="rotate" hidden><div class="ph"></div><div>Turn your phone sideways</div></div>

<script>
'use strict';
const VERSION = 'v1.20';
/* ================= constants & settings ================= */
const W = 800, H = 450, TOP = 36, BOT = H - 10;
const LS_X = 12, START_X = 50, SAFE_L = 96, SAFE_R = W - 104, ST_X = W - 34;
const RS = 1.2;
const DOCK_TOL = 8, BRAKE_MAX = 3, VMAX = 230, BLINK = 5, FUSE = 5, BLAST = 54, BPM = 116;
const DEF = { speed: 60, rate: 0.8, station: 55, style: 'both', step: 15, lvDocks: 10, lvMin: 3, startLv: 1, grav: 1 };
const NUMKEYS = ['speed', 'rate', 'station', 'step', 'lvDocks', 'lvMin', 'startLv', 'grav'], STYLES = ['tilt', 'roll', 'both'];
const S = { ...DEF, god: false };
let best = 0, testMode = false, soundMode = 'all';

function load() {
  try {
    let d = JSON.parse(localStorage.getItem('stardock.v2') || 'null');
    if (!d) { const o = JSON.parse(localStorage.getItem('stardock.v1') || '{}'); d = { best: o.best }; }
    if (d.best) best = d.best | 0;
    if (d.S) { for (const k of NUMKEYS) if (typeof d.S[k] === 'number') S[k] = d.S[k]; if (STYLES.includes(d.S.style)) S.style = d.S.style; }
    if (d.test) testMode = true;
    if (['all', 'fx', 'mute'].includes(d.sound)) soundMode = d.sound;
  } catch (e) {}
}
function save() {
  const o = { best, test: testMode, sound: soundMode, S: { style: S.style } };
  for (const k of NUMKEYS) o.S[k] = S[k];
  try { localStorage.setItem('stardock.v2', JSON.stringify(o)); } catch (e) {}
}
load();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);

function update(dt, rdt = dt) {

      floats.push({ x: ST_X - 70, y: stY - 26, text: '+1000', t: 0, c: '#ffd36e' });
      burst(ST_X - 22, stY, 30, ['#ffe14a', '#fff', '#6ef3ff'], 100, 0.7);
      if (level >= 3) for (let i = 0; i < 8; i++) steam.push({ x: ST_X - 20, y: stY + (i % 2 ? 9 : -9), vx: -10 - Math.random() * 20, vy: (i % 2 ? 1 : -1) * (10 + Math.random() * 14), r: 2, t: 0, life: 1.2 });
    }
    if (dockT > 1.7) { R.y = clamp(R.y, TOP + 8, BOT - 8); relaunch(0.8); phase = 'fly'; }
  } else if (phase === 'dead') {
    deadT += rdt;
    if (deadT > 2.9) {
      if (lives <= 0) gameOver();
      else {
        if (mineStock === 0) { mineStock = 3; updateMineBtn(); floats.push({ x: 120, y: H / 2 - 30, text: '+3 MINES', t: 0, c: '#ff9a9a' }); A.drop(); if (G) G.mineGifts = (G.mineGifts || 0) + 1; }
        R.y = safeRespawnY(); relaunch(1.2); R.inv = 2.2; phase = 'fly';
      }
    }
  }
}

function updateRocket(dt) {
  if (R.clamped) {
    R.clampT += dt; R.x = START_X; R.vx = 0; R.vy = 0; R.a *= 0.8; R.roll *= 0.8;
    const moved = Math.abs(R.ty - R.y) > 2 || keys.up || keys.down || gpUp || gpDown || gpAxis !== 0; // the first move
    R.y = lsY;
    const can = lsY >= TOP + 8;
    let go = false;
    if (demo) go = can && R.clampT > 0.6 && (laneCost(R.y, Math.max(25, curSpeed())) < 40 || R.clampT > 4);
    else go = can && moved;
    if (can && lsY >= BOT - 14) go = true; // end of the line: launched anyway
    A.thrust(0); A.brake(0);
    if (!go) { R.ty = R.y; return; }
    const keep = R.ty; launch(); R.ty = clamp(demo ? R.y : keep, TOP + 8, BOT - 8);
  }
  if (demo) aiSteer(dt);
  else if (keys.up || keys.down || gpUp || gpDown) { R.ty = R.y + ((keys.down || gpDown ? 1 : 0) - (keys.up || gpUp ? 1 : 0)) * 60; gpSteer = gpUp || gpDown; }
  else if (gpAxis && !drag) { R.ty = R.y + gpAxis * VMAX / 9; gpSteer = true; } // analog: stick deflection sets the climb/dive speed; the touch strip wins
  else if (gpSteer) { R.ty = R.y + R.vy * 0.05; gpSteer = false; }
  R.ty = clamp(R.ty, TOP + 8, BOT - 8);
  const want = clamp((R.ty - R.y) * 9, -VMAX, VMAX);
  R.vy += (want - R.vy) * Math.min(1, dt * 14);
  R.y += R.vy * dt;
  if (R.y < TOP + 8) { R.y = TOP + 8; if (R.vy < 0) R.vy = 0; }
  if (R.y > BOT - 8) { R.y = BOT - 8; if (R.vy > 0) R.vy = 0; }
  const tiltT = S.style === 'roll' ? 0 : (R.vy / VMAX) * 0.42;
  const rollT = S.style === 'tilt' ? 0 : (R.vy / VMAX) * 1.15;
  R.a += (tiltT - R.a) * Math.min(1, dt * 10);
  R.roll += (rollT - R.roll) * Math.min(1, dt * 8);
  if (R.wob > 0) R.wob = Math.max(0, R.wob - dt * 2.2);
  if (R.drift > 0.5) { R.ty = clamp(R.ty + R.drift * dt, TOP + 8, BOT - 8); R.drift *= Math.exp(-dt * 1.2); }
  A.thrust(Math.min(1, Math.abs(R.vy) / VMAX));
  if (R.inv > 0) R.inv -= dt;
  const wantBrake = braking && fuel > 0 && R.ready <= 0;
  if (wantBrake) { if (trip) trip.brake += dt; if (G) G.brake += dt; fuel = Math.max(0, fuel - dt); if (fuel === 0) { A.empty(); floats.push({ x: R.x + 10, y: R.y - 24, text: 'NO BRAKE FUEL', t: 0, c: '#9feeff' }); } }
  else if (!braking) fuel = Math.min(BRAKE_MAX, fuel + dt * 0.4);
  brakeLevel += ((wantBrake ? 1 : 0) - brakeLevel) * Math.min(1, dt * 12);
  A.brake(brakeLevel);
  if (R.ready > 0) R.ready -= dt;
  else {
    // slingshot: near a planet its gravity bends the path a little towards it and adds speed, kept for the rest of the trip
    let pull = 0, gain = 0;
    if (S.grav > 0) for (const o of saturns) {
      const dx = o.x - R.x, dy = o.y - R.y, d = Math.hypot(dx, dy), rin = o.r * 2.2 + 50;
      if (d < rin && d > 1) { const f = Math.pow(1 - d / rin, 1.5) * S.grav; pull += (dy / d) * 40 * f; gain += 30 * f; }
    }
    if (pull) R.ty = clamp(R.ty + pull * dt, TOP + 8, BOT - 8);
    if (gain > 0) {
      const cap = curSpeed() * 0.4 * Math.min(1.5, S.grav);
      R.boost = Math.min(cap, R.boost + gain * dt);
      if (!R.inWell && R.boost > 4) {
        R.inWell = true; A.sling(); floats.push({ x: R.x + 20, y: R.y - 22, text: 'SLINGSHOT!', t: 0, c: '#6ef3ff' });
        if (trip) trip.slings++; if (G) G.slings = (G.slings || 0) + 1;
      }
    } else R.inWell = false;
    const tgt = wantBrake ? 0 : curSpeed() + R.boost;
    if (R.vx > tgt) R.vx = Math.max(tgt, R.vx - 340 * dt); else R.vx = Math.min(tgt, R.vx + 170 * dt);
    R.x += R.vx * dt;
    if (Math.random() < dt * 45 * clamp(R.vx / Math.max(1, curSpeed()), 0, 1) && parts.length < 700)
      parts.push({ x: R.x - 22, y: R.y + (Math.random() - 0.5) * 4, vx: -50 - Math.random() * 40, vy: (Math.random() - 0.5) * 14, life: 0.35, t: 0, c: Math.random() < 0.5 ? '#ffb347' : '#ff4fd8', s: 1.5 });
  }
  const pts = rocketPts();
  if (R.inv <= 0 && !S.god) {
    for (const s of stars) {
      if (!s.perm) continue;
      for (const p of pts) {
        const dx = s.x - p.x, dy = s.y - p.y;
        if (dx * dx + dy * dy < (p.r + 1.5) * (p.r + 1.5)) { die('star'); return; }
      }
    }
    for (const o of saturns) for (const p of pts) if (hitSaturn(o, p)) { die('saturn'); return; }
  }
  // dock only with the nose in the marked port; anything else bounces off the station
  if (bounceCD > 0) bounceCD -= dt;
  const n = pts[0];
  const aligned = R.ready <= 0 && Math.abs(n.y - stY) <= DOCK_TOL && n.x > ST_X - 260;
  if (aligned && !R.locked) A.lockOn();
  R.locked = aligned;
  R.lock += ((aligned ? 1 : 0) - R.lock) * Math.min(1, dt * 12);
  if (n.x + n.r >= ST_X - 23 && n.x <= ST_X - 8 && Math.abs(n.y - stY) <= DOCK_TOL) { dock(); return; }
  if (bounceCD <= 0) for (const p of pts) {
    if (circRect(p, ST_X - 14, stY - 34, 28, 68) || circRect(p, ST_X - 22, stY - 11, 9, 22)) { bounce(p); break; }
  }
  if (R.x > W + 30) {
    floats.push({ x: W - 150, y: R.y, text: 'MISSED', t: 0, c: '#ff7ad9' });
    A.miss(); tripEnd('miss'); relaunch(0.7); commEvent('miss', 0.6);
  }
}

/* ================= drawing ================= */
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

const noseCol = k => k <= 1 ? `rgb(255,${Math.round(138 + 87 * k)},${Math.round(42 + 32 * k)})` // orange -> yellow
  : `rgb(255,${Math.round(225 + 25 * (k - 1))},${Math.round(74 + 136 * (k - 1))})`;           // -> white-gold when docked
function drawRocket(x, y, a, sc, flame, vy, roll = 0, brake = 0, lock = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sc, sc);
  ctx.lineJoin = 'round';
  if (flame) {
    const len = flame * (7 + Math.random() * 6);
    ctx.fillStyle = '#ff7a3c';
    ctx.beginPath(); ctx.moveTo(-13, -4.5); ctx.lineTo(-13 - len, 0); ctx.lineTo(-13, 4.5); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.moveTo(-13, -2.5); ctx.lineTo(-13 - len * 0.55, 0); ctx.lineTo(-13, 2.5); ctx.fill();
  }
  if (brake > 0.05) { // retro rockets firing forward from the nose
    const l = brake * (6 + Math.random() * 5);
    for (const d of [-1, 1]) {
      ctx.fillStyle = '#6ef3ff';
      ctx.beginPath(); ctx.moveTo(8, d * 4); ctx.lineTo(10 + l, d * (6 + l * 0.45)); ctx.lineTo(12, d * 2.5); ctx.fill();
      ctx.fillStyle = '#e8fdff';
      ctx.beginPath(); ctx.moveTo(9, d * 3.6); ctx.lineTo(10 + l * 0.55, d * (5 + l * 0.25)); ctx.lineTo(11, d * 2.8); ctx.fill();
    }
  }
  if (vy && Math.abs(vy) > 25) { // little side thruster puffs
    const l = Math.min(1, Math.abs(vy) / VMAX) * (5 + Math.random() * 3), d = vy < 0 ? 1 : -1;
    ctx.fillStyle = '#9feeff';
    ctx.beginPath(); ctx.moveTo(-5, d * 6); ctx.lineTo(-3, d * (6 + l)); ctx.lineTo(-1, d * 6); ctx.fill();
  }
  ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 1.5;
  // three fins around the axis; rolling turns them in 3D
  const fins = [roll + Math.PI / 3, roll + Math.PI, roll + 5 * Math.PI / 3];
  const fin = phi => {
    const sn = Math.sin(phi), cs = Math.cos(phi);
    let yr = sn * 5, yt = sn * 12.5;
    if (Math.abs(yt - yr) < 1.4) yt = yr + (yt >= yr ? 1.4 : -1.4);
    ctx.fillStyle = cs > 0 ? '#ff3d6e' : '#a8204a';
    ctx.beginPath(); ctx.moveTo(-5, yr); ctx.lineTo(-13, yr); ctx.lineTo(-19, yt); ctx.lineTo(-15, yt); ctx.closePath();
    ctx.fill(); ctx.stroke();
  };
  for (const f of fins) if (Math.cos(f) <= 0) fin(f);
  // body
  const g = ctx.createLinearGradient(0, -6, 0, 6);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e6e0ff'); g.addColorStop(1, '#a99ad8');
  ctx.fillStyle = g; rr(ctx, -14, -6, 23, 12, 5); ctx.fill(); ctx.stroke();
  // nose: orange and rounded; when locked on the port it turns yellow and squarer, like a docking adapter
  const tipX = 20 - 1.8 * lock, flat = 3.6 * lock, cxn = 19 - 0.6 * lock, cyn = 4.5 + 1.4 * lock;
  ctx.fillStyle = noseCol(lock);
  if (lock > 0.05) { ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 8 * lock; }
  ctx.beginPath(); ctx.moveTo(8, -6); ctx.quadraticCurveTo(cxn, -cyn, tipX, -flat); ctx.lineTo(tipX, flat); ctx.quadraticCurveTo(cxn, cyn, 8, 6); ctx.closePath();
  ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  if (lock > 0.5) { ctx.fillStyle = `rgba(20,10,48,${Math.min(1, (lock - 0.5) * 2)})`; ctx.fillRect(tipX - 1.6, -flat * 0.45, 1.6, flat * 0.9); }
  if (lock > 1) { ctx.strokeStyle = `rgba(255,255,255,${lock - 1})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tipX - 3.5, -flat + 0.8); ctx.lineTo(tipX - 3.5, flat - 0.8); ctx.stroke(); ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 1.5; }
  // stripe ring
  ctx.fillStyle = '#ff3d6e'; ctx.fillRect(-10, -5.2, 2.5, 10.4);
  // porthole on the side facing us; it slides round the body as the rocket rolls
  const wc = Math.cos(roll), wsn = Math.sin(roll);
  if (wc > 0.06) {
    const cy = wsn * 3.4;
    ctx.fillStyle = '#cfd3ea'; ctx.beginPath(); ctx.ellipse(1, cy, 4.2, 4.2 * wc, 0, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3ad0ff'; ctx.beginPath(); ctx.ellipse(1, cy, 2.8, 2.8 * wc, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, cy - wc, 1, wc, 0, 0, 6.283); ctx.fill();
  }
  for (const f of fins) if (Math.cos(f) > 0) fin(f);
  ctx.restore();
}

// Level 3+: a bat-wing craft with flapping scalloped wings. Same hitbox as the rocket.
function drawBat(x, y, a, sc, flame, vy, roll = 0, brake = 0, lock = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sc, sc);
  ctx.lineJoin = 'round';
  if (flame) {
    const len = flame * (6 + Math.random() * 5);
    ctx.fillStyle = '#ff4fd8'; ctx.beginPath(); ctx.moveTo(-12, -3); ctx.lineTo(-12 - len, 0); ctx.lineTo(-12, 3); ctx.fill();
    ctx.fillStyle = '#ffd0f4'; ctx.beginPath(); ctx.moveTo(-12, -1.5); ctx.lineTo(-12 - len * 0.55, 0); ctx.lineTo(-12, 1.5); ctx.fill();
  }
  if (brake > 0.05) {
    const l = brake * (6 + Math.random() * 5);
    for (const d of [-1, 1]) { ctx.fillStyle = '#6ef3ff'; ctx.beginPath(); ctx.moveTo(7, d * 3); ctx.lineTo(9 + l, d * (5 + l * 0.45)); ctx.lineTo(11, d * 2); ctx.fill(); }
  }
  ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 1.4;
  const flap = Math.sin(time * 11) * 0.45;
  const wings = [roll - Math.PI / 2 + flap, roll + Math.PI / 2 - flap];
  const wing = phi => {
    const sn = Math.sin(phi), cs = Math.cos(phi), Y = sn * 19, lean = cs * 3, dir = Math.sign(sn) || 1;
    const wx = 2, wy = Y * 0.72 + lean, tips = [[-3, Y + lean], [-9, Y * 0.78 + lean], [-14, Y * 0.5 + lean]];
    ctx.fillStyle = cs > 0 ? '#4b2b70' : '#2a1641';
    ctx.beginPath(); ctx.moveTo(6, sn * 3); ctx.lineTo(wx, wy); ctx.lineTo(tips[0][0], tips[0][1]);
    let [px, py] = tips[0];
    for (const [qx, qy] of [tips[1], tips[2], [-11, sn * 3.5]]) {
      ctx.quadraticCurveTo((px + qx) / 2 + 2, (py + qy) / 2 - dir * 4.5, qx, qy); px = qx; py = qy; // scalloped membrane
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,79,216,0.7)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); for (const [tx, ty] of tips) { ctx.moveTo(wx, wy); ctx.lineTo(tx, ty); } ctx.stroke();
    ctx.fillStyle = '#ff4fd8'; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 2.5, wy + dir * 1.8); ctx.lineTo(wx + 0.5, wy + dir * 0.4); ctx.fill(); // thumb claw
    ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 1.4;
  };
  for (const w of wings) if (Math.cos(w) <= 0) wing(w);
  // body
  const g = ctx.createLinearGradient(0, -6, 0, 6);
  g.addColorStop(0, '#6a4796'); g.addColorStop(1, '#2b1a45');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(-2, 0, 11, 5.4, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(160,130,220,0.35)'; ctx.beginPath(); ctx.ellipse(-3, 2.2, 8, 1.6, 0, 0, 6.283); ctx.fill();
  // ears
  const eh = Math.max(0.25, Math.cos(roll));
  ctx.fillStyle = '#4b2b70';
  ctx.beginPath(); ctx.moveTo(1, -4.4); ctx.lineTo(2.5, -4.4 - 6.5 * eh); ctx.lineTo(4.8, -4.2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, -3.9); ctx.lineTo(6.2, -3.9 - 5.5 * eh); ctx.lineTo(7.6, -3); ctx.closePath(); ctx.fill(); ctx.stroke();
  // glowing eye (the cockpit)
  const ec = Math.cos(roll);
  if (ec > 0.08) { ctx.fillStyle = '#ffd36e'; ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 6; ctx.beginPath(); ctx.ellipse(4, -0.8 + Math.sin(roll) * 2, 2, 1.3 * ec, 0, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; }
  // snout: orange, yellow on lock, white-gold collar when docked
  const tipX = 15 - 1.2 * lock, flat = 2.4 * lock, cxn = 14 - 0.5 * lock, cyn = 3.2 + 1 * lock;
  ctx.fillStyle = noseCol(lock);
  if (lock > 0.05) { ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 8 * lock; }
  ctx.beginPath(); ctx.moveTo(7, -3.6); ctx.quadraticCurveTo(cxn, -cyn, tipX, -flat); ctx.lineTo(tipX, flat); ctx.quadraticCurveTo(cxn, cyn, 7, 3.6); ctx.closePath();
  ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  if (lock > 0.5) { ctx.fillStyle = `rgba(20,10,48,${Math.min(1, (lock - 0.5) * 2)})`; ctx.fillRect(tipX - 1.3, -flat * 0.45, 1.3, flat * 0.9); }
  for (const w of wings) if (Math.cos(w) > 0) wing(w);
  ctx.restore();
}

// Level 2+: a sleeker fighter. Same hitbox as the rocket.
function drawFighter(x, y, a, sc, flame, vy, roll = 0, brake = 0, lock = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(sc, sc);
  ctx.lineJoin = 'round';
  if (flame) for (const yy of [-2.4, 2.4]) {
    const len = flame * (6 + Math.random() * 5);
    ctx.fillStyle = '#ff7a3c'; ctx.beginPath(); ctx.moveTo(-17, yy - 2); ctx.lineTo(-17 - len, yy); ctx.lineTo(-17, yy + 2); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.moveTo(-17, yy - 1); ctx.lineTo(-17 - len * 0.55, yy); ctx.lineTo(-17, yy + 1); ctx.fill();
  }
  if (brake > 0.05) {
    const l = brake * (6 + Math.random() * 5);
    for (const d of [-1, 1]) {
      ctx.fillStyle = '#6ef3ff'; ctx.beginPath(); ctx.moveTo(9, d * 3.6); ctx.lineTo(11 + l, d * (5.5 + l * 0.45)); ctx.lineTo(13, d * 2.2); ctx.fill();
    }
  }
  if (vy && Math.abs(vy) > 25) {
    const l = Math.min(1, Math.abs(vy) / VMAX) * (5 + Math.random() * 3), d = vy < 0 ? 1 : -1;
    ctx.fillStyle = '#9feeff'; ctx.beginPath(); ctx.moveTo(-4, d * 4.5); ctx.lineTo(-2, d * (4.5 + l)); ctx.lineTo(0, d * 4.5); ctx.fill();
  }
  ctx.strokeStyle = '#12101e'; ctx.lineWidth = 1.3;
  // swept wings and a tail fin; rolling turns them in 3D (with a slight top-down view so the wings show)
  const parts3d = [
    { phi: roll, kind: 'wing' }, { phi: roll + Math.PI, kind: 'wing' }, { phi: roll - Math.PI / 2, kind: 'fin' }
  ];
  const draw3d = p => {
    const sn = Math.sin(p.phi), cs = Math.cos(p.phi);
    ctx.fillStyle = cs > 0 ? '#c3c9dc' : '#6b7290';
    ctx.beginPath();
    if (p.kind === 'wing') {
      const yt = sn * 14 + cs * 5.5;
      ctx.moveTo(4, 0); ctx.lineTo(-11, 0); ctx.lineTo(-15, yt); ctx.lineTo(-9, yt);
    } else {
      const yt = sn * 11;
      ctx.moveTo(-6, sn * 3); ctx.lineTo(-15, sn * 3); ctx.lineTo(-18, yt); ctx.lineTo(-14, yt);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (cs > 0 && p.kind === 'wing') { ctx.fillStyle = noseCol(0); ctx.globalAlpha = 0.9; ctx.fillRect(-14, (sn * 14 + cs * 5.5) * 0.85 - 0.6, 4, 1.2); ctx.globalAlpha = 1; }
  };
  for (const p of parts3d) if (Math.cos(p.phi) <= 0) draw3d(p);
  // engines
  ctx.fillStyle = '#3a3f55'; ctx.fillRect(-18, -4.8, 5, 9.6); ctx.strokeRect(-18, -4.8, 5, 9.6);
  ctx.fillStyle = '#1a1c28'; ctx.beginPath(); ctx.arc(-18, -2.4, 1.6, 0, 6.283); ctx.arc(-18, 2.4, 1.6, 0, 6.283); ctx.fill();
  // fuselage
  const g = ctx.createLinearGradient(0, -5, 0, 5);
  g.addColorStop(0, '#f2f4fa'); g.addColorStop(0.55, '#c9cfdf'); g.addColorStop(1, '#8a92ad');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-15, -4.2); ctx.lineTo(4, -4.8); ctx.lineTo(13, -3.4); ctx.lineTo(13, 3.4); ctx.lineTo(4, 4.4); ctx.lineTo(-15, 4.2); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(40,40,70,0.45)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-9, -4.3); ctx.lineTo(-9, 4.3); ctx.moveTo(-3, -4.6); ctx.lineTo(-3, 4.5); ctx.stroke();
  ctx.fillStyle = '#ff8a2a'; ctx.fillRect(-14, -1.2, 9, 0.9); ctx.fillRect(-14, 0.5, 9, 0.9);
  ctx.strokeStyle = '#12101e'; ctx.lineWidth = 1.3;
  // canopy on top, foreshortened by the roll
  const cc = Math.cos(roll);
  if (cc > 0.08) {
    const cg = ctx.createLinearGradient(0, -9, 0, -4);
    cg.addColorStop(0, '#9feeff'); cg.addColorStop(1, '#1d4f7a');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.moveTo(-2, -4.6); ctx.quadraticCurveTo(3, -4.6 - 4.4 * cc, 10, -3.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // nose cone: orange, pointed; on lock it turns yellow and squarer
  const tip = 25 - 3 * lock, fl = 2.4 * lock;
  ctx.fillStyle = noseCol(lock);
  if (lock > 0.05) { ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 8 * lock; }
  ctx.beginPath(); ctx.moveTo(13, -3.4); ctx.lineTo(tip, -fl); ctx.lineTo(tip, fl); ctx.lineTo(13, 3.4); ctx.closePath();
  ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
  if (lock > 0.5) { ctx.fillStyle = `rgba(20,10,48,${Math.min(1, (lock - 0.5) * 2)})`; ctx.fillRect(tip - 1.4, -fl * 0.5, 1.4, fl); }
  for (const p of parts3d) if (Math.cos(p.phi) > 0) draw3d(p);
  ctx.restore();
}

function drawCog(cx, cy, r, teeth, rot, fill) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);

// Left stick or D-pad: steer. A: mine. B, shoulders or triggers: brake (hold). Start: play / pause.
let gpBase = null, gpDbgN = 0, gpPrev = [], gpIndex = null, gpWarned = false, gpBrake = false, gpUp = false, gpDown = false, gpAxis = 0, gpSteer = false;
const GP_HELP = '\ud83c\udfae Gamepad ready: stick or D-pad steers \u00b7 A mine \u00b7 B / shoulders / triggers brake \u00b7 Start play/pause';
addEventListener('gamepadconnected', e => { gpIndex = e.gamepad.index; gpBase = null; toast(GP_HELP, 6000); });
addEventListener('gamepaddisconnected', e => {
  if (gpIndex === e.gamepad.index) { gpIndex = null; gpBase = null; }
  gpAxis = 0; gpUp = gpDown = false; if (gpBrake) { gpBrake = false; brakeOff(); }
  toast('\ud83c\udfae Gamepad disconnected');
});
function rumble(ms, strong, weak) {
  if (gpIndex == null) return;
  try { const p = navigator.getGamepads()[gpIndex]; if (p && p.vibrationActuator) p.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); } catch (e) {}
}

  catch (e) { if (!gpWarned) { gpWarned = true; toast('Gamepads are blocked on this page. The game needs its own page (like Tilescraper) for a pad.', 6000); } return; }
  let p = gpIndex != null ? pads[gpIndex] : null;
  if (!p) for (const q of pads) if (q && q.connected) { p = q; gpIndex = q.index; break; }
  if (!p) return;
  const down = i => !!(p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.3));
  const now = p.buttons.map((x, i) => down(i)), prev = gpPrev;
  const hit = i => now[i] && !prev[i];
  const any = now.some((v, i) => v && !prev[i]);
  gpPrev = now;
  if (any) idleT = 0;
  // the stick's resting value is learned when the pad first appears; an axis that rests far off centre (a trigger) is ignored

  gpAxis = Math.abs(ly) > dz ? Math.sign(ly) * Math.pow(Math.min(1, (Math.abs(ly) - dz) / (1 - dz)), 1.4) : 0;
  if (testMode && (gpDbgN = (gpDbgN + 1) % 10) === 0) {
    const el = document.getElementById('gpDbg');
    if (el) el.textContent = '\ud83c\udfae ' + (p.id || '?').slice(0, 28) + ' \u00b7 ' + (p.mapping || 'no mapping') + ' \u00b7 axes ' + p.axes.map(v => (+v).toFixed(2)).join(' ') + ' \u00b7 buttons ' + now.map((v, i) => v ? i : -1).filter(i => i >= 0).join(',');
  }
  gpUp = !!now[12]; gpDown = !!now[13];
  const br = now[1] || now[4] || now[5] || now[6] || now[7];
  if (br && !gpBrake) { gpBrake = true; brakeOn(); } else if (!br && gpBrake) { gpBrake = false; brakeOff(); }

    A.init(); A.resume(); startGame();
    setTimeout(() => { if (A.ctx && A.ctx.state !== 'running') toast('Tap the screen once to switch the sound on.'); }, 700);
  };

  else if (state === 'play') { if (hit(0)) dropMine(); if (hit(9)) pause(); }
  else if (state === 'paused') { if (hit(9) || hit(0)) { A.resume(); resumeGame(); } }

let last = performance.now(), bgCheck = 0;
function frame(now) {

  update(dt * timeScale, dt); render();

}

function applySound() { btnSound.dataset.state = soundMode; soundLabel.textContent = SOUND_LABEL[soundMode]; A.setMode(soundMode); }
btnSound.addEventListener('click', () => { A.init(); A.resume(); soundMode = SOUND_NEXT[soundMode]; applySound(); save(); });

addEventListener('keydown', e => {
  const k = e.key; idleT = 0;
  if (demo) { e.preventDefault(); stopDemo(); return; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
  else if (k === ' ') { e.preventDefault(); if (!e.repeat) dropMine(); }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'Shift') { e.preventDefault(); brakeOn(); }
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'p' || k === 'P' || k === 'Escape') { if (state === 'play') pause(); else if (state === 'paused') { A.resume(); resumeGame(); } }
  else if (k === 'Enter' && (state === 'title' || state === 'over')) startGame();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'Shift') brakeOff();
  if (!keys.up && !keys.down) R.ty = R.y + R.vy * 0.05;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { pause(); if (G) { G.ended = 'paused'; saveStats(); } } });
addEventListener('pagehide', () => { if (G && state !== 'over') { G.ended = 'left'; saveStats(); } });

/* ================= boot ================= */
$('ver').textContent = 'STAR DOCK ' + VERSION;
syncSliders();
applySound();
makeSaturns();
resize();
showOverlay('title');
updateMineBtn();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
